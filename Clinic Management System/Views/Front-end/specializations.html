<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>عيادتي - التخصصات الطبية</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f4f6f9; }
        .sidebar { min-height: 100vh; background-color: #1e293b; color: #fff; }
        .sidebar .nav-link { color: #cbd5e1; padding: 12px 20px; border-radius: 8px; margin-bottom: 5px; }
        .sidebar .nav-link:hover, .sidebar .nav-link.active { background-color: #0ea5e9; color: #fff; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <nav class="col-md-3 col-lg-2 d-md-block sidebar collapse p-3">
            <div class="text-center my-3">
                <i class="bi bi-hospital fs-1 text-info"></i>
                <h5 class="mt-2 fw-bold">عيادة الشفاء</h5>
            </div>
            <hr class="text-secondary">
            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link" href="index.html"><i class="bi bi-speedometer2 me-2"></i> لوحة الاستقبال</a></li>
                <li class="nav-item"><a class="nav-link" href="create-appointment.html"><i class="bi bi-calendar-plus me-2"></i> حجز كشف جديد</a></li>
                <li class="nav-item"><a class="nav-link" href="doctors.html"><i class="bi bi-person-badge me-2"></i> الأطباء</a></li>
                <li class="nav-item"><a class="nav-link active" href="specializations.html"><i class="bi bi-grid me-2"></i> التخصصات</a></li>
                <li class="nav-item"><a class="nav-link" href="patients.html"><i class="bi bi-people me-2"></i> سجل المرضى</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
            <h1 class="h3 fw-bold pb-2 mb-4 border-bottom">إدارة التخصصات الطبية</h1>

            <div class="row g-4">
                <!-- فورم إضافة تخصص سريع -->
                <div class="col-md-4">
                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-primary text-white fw-bold">إضافة تخصص جديد</div>
                        <div class="card-body">
                            <form action="specializations.html" method="post">
                                <div class="mb-3">
                                    <label class="form-label">اسم التخصص <span class="text-danger">*</span></label>
                                    <input type="text" name="Name" class="form-control" required placeholder="مثال: طب الأطفال">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">وصف مختصر</label>
                                    <textarea name="Description" class="form-control" rows="3" placeholder="وصف للقسم..."></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">حفظ التخصص</button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- جدول التخصصات -->
                <div class="col-md-8">
                    <div class="card border-0 shadow-sm">
                        <div class="card-body p-0">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>#</th>
                                        <th>اسم التخصص</th>
                                        <th>الوصف</th>
                                        <th>عدد الأطباء</th>
                                        <th class="text-center">إجراءات</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td>1</td>
                                        <td class="fw-bold">باطنة وجهاز هضمي</td>
                                        <td class="text-muted small">تشخيص وعلاج أمراض الباطنة والمعدة</td>
                                        <td><span class="badge bg-secondary">3 أطباء</span></td>
                                        <td class="text-center">
                                            <button class="btn btn-sm btn-outline-secondary"><i class="bi bi-pencil"></i></button>
                                            <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>2</td>
                                        <td class="fw-bold">طب وجراحة الأسنان</td>
                                        <td class="text-muted small">حشو، خلع، وتقويم الأسنان</td>
                                        <td><span class="badge bg-secondary">2 أطباء</span></td>
                                        <td class="text-center">
                                            <button class="btn btn-sm btn-outline-secondary"><i class="bi bi-pencil"></i></button>
                                            <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
</html>
